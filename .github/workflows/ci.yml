name: FluentFlow checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-api.lock -r requirements-dev.txt
      - run: ruff check backend tests evaluation scripts app.py
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker build -t fluentflow-api:local-verified .
      - run: docker build -f frontend/Dockerfile -t fluentflow-web:local-verified .
      - run: docker run --rm -i fluentflow-api:local-verified python - < tests/native_ocr_smoke.py
      - run: pip install httpx
      - run: docker compose -p fluentflow-verification -f deployment/compose.verify.yml up -d --wait --wait-timeout 120
      - run: python -m tests.smoke_deployment
      - run: python -m tests.smoke_deployment
        env:
          SMOKE_BASE_URL: http://127.0.0.1:18081
      - if: always()
        run: docker compose -p fluentflow-verification -f deployment/compose.verify.yml down
